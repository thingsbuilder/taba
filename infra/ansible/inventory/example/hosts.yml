all:
  hosts:
    # explícito (não implícito) para o localhost herdar group_vars/all
    localhost:
      ansible_connection: local
      # python do próprio ansible (pipx) — onde google-auth/requests estão
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    taba_prod:
      hosts:
        taba:
          # pelo domínio: o configure.yml só roda depois do registro DNS existir
          ansible_host: "{{ taba_domain }}"
          ansible_user: "{{ vm_ssh_user }}"
