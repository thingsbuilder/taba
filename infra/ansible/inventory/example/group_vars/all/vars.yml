# Valores de exemplo. Copie inventory/example/ para inventory/prod/ e troque pelos seus.
gcp_project: "meu-projeto-123456"
# e2-micro gratuita só em us-east1/us-central1/us-west1; us-east1 é a mais perto do Brasil
gcp_region: us-east1
gcp_zone: us-east1-b

taba_domain: "taba.example.org"

# Release do GitHub instalada pelo configure.yml. Troque a cada deploy:
#   ansible-playbook playbooks/configure.yml -e taba_version=v0.1.0
taba_release_repo: "thingsbuilder/taba"
taba_version: "v0.1.0"

vm_name: taba
vm_ssh_user: taba
ssh_pubkey: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"

# segredos: só por referência ao vault (ver vault.yml.example)
unico_access_key: "{{ vault_taba_unico_access_key }}"
hmac_key: "{{ vault_taba_hmac_key }}"
thumbnail_key: "{{ vault_taba_thumbnail_key }}"

# Opcionais (os valores abaixo são os padrões da API)
# unico_url: "https://humantoken.unico.app/client/v1"
# session_days: 7
# shelter_radius_m: 100
# event_radius_km: 50
# inactivity_days: 30
# purge_after_days: 30
# searches_per_day: 10
# fuso do dia da cota de buscas (nome IANA)
# tz_pilot: America/Sao_Paulo
# fração das entregas comuns que pedem selfie (0 a 1)
# delivery_sample_rate: 0.05
# Nome e contato do responsável pelo piloto, mostrados nas telas de coleta (spec 10.1.3)
pilot_responsible: "Nome do responsável, contato"
