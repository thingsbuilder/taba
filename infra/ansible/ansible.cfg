[defaults]
# inventory/prod/ é local e fica fora do git (tem os valores reais). Para montar o seu,
# copie inventory/example/ — ver infra/README.md.
inventory = inventory/prod/hosts.yml
# A senha do vault NÃO vem daqui: exporte ANSIBLE_VAULT_PASSWORD_FILE no seu shell.
interpreter_python = auto_silent
# VM recém-criada sem fricção; depois do primeiro ssh a chave fica
host_key_checking = False
